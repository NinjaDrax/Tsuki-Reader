# Netlify: static site. The build step downloads libraries + generates icons.
[build]
  command = "bash tools/setup.sh"
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript"
